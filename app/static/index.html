<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas AI</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --border: #dfe3e8;
      --accent: #3b5bdb;
      --accent-text: #ffffff;
      --user-bubble: #3b5bdb;
      --user-text: #ffffff;
      --tool-bg: #eef1f6;
      --error-bg: #fdecec;
      --error-text: #a61b1b;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --surface: #1a1e24;
        --text: #e6e9ee;
        --muted: #98a2b3;
        --border: #2c323b;
        --accent: #7c93f5;
        --accent-text: #0d1117;
        --user-bubble: #3b5bdb;
        --user-text: #ffffff;
        --tool-bg: #232934;
        --error-bg: #3a1d1d;
        --error-text: #ffb4b4;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header p { margin: 0; font-size: .8rem; color: var(--muted); }
    button {
      font: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    header button { white-space: nowrap; flex-shrink: 0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); }
    .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
    .msg.error { align-self: flex-start; background: var(--error-bg); color: var(--error-text); }
    .msg code { background: var(--tool-bg); padding: 1px 5px; border-radius: 6px; font-size: .9em; }
    .msg.user code { background: rgba(255, 255, 255, .2); }
    .tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .tools:empty { display: none; }
    .tool {
      background: var(--tool-bg);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: .85rem;
      white-space: normal;
    }
    .tool summary { cursor: pointer; color: var(--muted); }
    .tool pre { margin: 6px 0 0; white-space: pre-wrap; font-size: .8rem; }
    .typing { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); margin-top: 10vh; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .composer { max-width: 760px; width: 100%; margin: 0 auto; display: flex; gap: 8px; }
    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      max-height: 160px;
    }
    textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    form button[type=submit] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Atlas AI</h1>
      <p>Agente com ferramentas: calculadora, data/hora e relatórios</p>
    </div>
    <button id="new-chat" type="button">Nova conversa</button>
  </header>

  <main id="scroll">
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <p>Peça uma tarefa em linguagem natural.</p>
        <div class="suggestions">
          <button type="button" data-suggestion>Quanto é (1250 * 12) * 0.15?</button>
          <button type="button" data-suggestion>Que horas são em Tóquio?</button>
          <button type="button" data-suggestion>Calcule 15% de 3000 e gere um relatório</button>
        </div>
      </div>
    </div>
  </main>

  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Escreva sua mensagem…" aria-label="Mensagem" required></textarea>
      <button type="submit" id="send">Enviar</button>
    </div>
  </form>

  <script>
    "use strict";

    const thread = document.getElementById("thread");
    const scroller = document.getElementById("scroll");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const newChatButton = document.getElementById("new-chat");

    // O servidor guarda o histórico; o navegador só precisa lembrar o thread_id.
    let threadId = null;
    let busy = false;

    // Renderiza **negrito** e `código` sem usar innerHTML (evita XSS).
    function renderText(element, text) {
      element.replaceChildren();
      const pattern = /(\*\*[^*]+\*\*|`[^`]+`)/g;
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        element.append(text.slice(last, match.index));
        const token = match[0];
        const node = document.createElement(token.startsWith("**") ? "strong" : "code");
        node.textContent = token.startsWith("**") ? token.slice(2, -2) : token.slice(1, -1);
        element.append(node);
        last = match.index + token.length;
      }
      element.append(text.slice(last));
    }

    function addMessage(role, text) {
      document.getElementById("empty")?.remove();
      const bubble = document.createElement("div");
      bubble.className = `msg ${role}`;
      if (role === "assistant") {
        const tools = document.createElement("div");
        tools.className = "tools";
        const body = document.createElement("div");
        body.className = "body";
        bubble.append(tools, body);
        if (text) renderText(body, text);
      } else {
        renderText(bubble, text);
      }
      thread.append(bubble);
      scrollToBottom();
      return bubble;
    }

    function addToolCall(bubble, name, args) {
      const item = document.createElement("details");
      item.className = "tool";
      const summary = document.createElement("summary");
      summary.textContent = `🔧 ${name}`;
      const detail = document.createElement("pre");
      detail.textContent = `argumentos: ${JSON.stringify(args)}`;
      item.append(summary, detail);
      bubble.querySelector(".tools").append(item);
      scrollToBottom();
      return item;
    }

    function scrollToBottom() {
      scroller.scrollTop = scroller.scrollHeight;
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      newChatButton.disabled = value;
    }

    // Lê um stream SSE vindo de fetch (EventSource não suporta POST).
    async function* readServerSentEvents(response) {
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value.replace(/\r\n/g, "\n");
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          let event = "message";
          const data = [];
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
          }
          if (data.length) yield { event, data: JSON.parse(data.join("\n")) };
        }
      }
    }

    async function errorDetail(response) {
      try {
        const body = await response.json();
        if (typeof body.detail === "string") return body.detail;
        if (Array.isArray(body.detail)) return "Mensagem inválida.";
      } catch { /* resposta sem JSON */ }
      return `Erro ${response.status}.`;
    }

    async function send(message) {
      if (busy || !message.trim()) return;
      setBusy(true);
      addMessage("user", message);
      const bubble = addMessage("assistant", "");
      const body = bubble.querySelector(".body");
      body.classList.add("typing");
      body.textContent = "Pensando…";
      let streamed = "";
      const pendingTools = [];

      try {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(threadId ? { message, thread_id: threadId } : { message }),
        });
        if (!response.ok) throw new Error(await errorDetail(response));

        for await (const { event, data } of readServerSentEvents(response)) {
          if (event === "token") {
            streamed += data.text;
            body.classList.remove("typing");
            renderText(body, streamed);
            scrollToBottom();
          } else if (event === "tool_call") {
            pendingTools.push(addToolCall(bubble, data.name, data.args));
            streamed = "";  // texto antes de uma ferramenta é só "raciocínio"
          } else if (event === "tool_result") {
            const item = pendingTools.shift();
            if (item) item.querySelector("pre").textContent += `\nresultado: ${data.output}`;
          } else if (event === "done") {
            threadId = data.thread_id;
            body.classList.remove("typing");
            renderText(body, data.answer);
          } else if (event === "error") {
            throw new Error(data.detail);
          }
        }
      } catch (error) {
        bubble.remove();
        addMessage("error", error.message || "Falha de conexão.");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value;
      input.value = "";
      autoResize();
      send(message);
    });

    // Enter envia; Shift+Enter quebra linha.
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    function autoResize() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight}px`;
    }
    input.addEventListener("input", autoResize);

    thread.addEventListener("click", (event) => {
      const button = event.target.closest("[data-suggestion]");
      if (button) send(button.textContent);
    });

    newChatButton.addEventListener("click", async () => {
      // Apaga o histórico no servidor antes de recarregar a página.
      if (threadId) {
        try {
          await fetch(`/threads/${threadId}`, { method: "DELETE" });
        } catch { /* se falhar, a conversa antiga só fica órfã na memória */ }
      }
      window.location.reload();
    });
  </script>
</body>
</html>
