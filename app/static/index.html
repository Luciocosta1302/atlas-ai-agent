<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas AI</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div>
      <h1>Atlas AI</h1>
      <p>Agente com ferramentas: calculadora, data/hora e relatórios</p>
    </div>
    <button id="new-chat" type="button">Nova conversa</button>
  </header>

  <main id="scroll">
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <p>Peça uma tarefa em linguagem natural.</p>
        <div class="suggestions">
          <button type="button" data-suggestion>Quanto é (1250 * 12) * 0.15?</button>
          <button type="button" data-suggestion>Que horas são em Tóquio?</button>
          <button type="button" data-suggestion>Calcule 15% de 3000 e gere um relatório</button>
        </div>
      </div>
    </div>
  </main>

  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Escreva sua mensagem…" aria-label="Mensagem" required></textarea>
      <button type="submit" id="send">Enviar</button>
    </div>
  </form>

  <script src="/static/app.js" defer></script>
</body>
</html>
