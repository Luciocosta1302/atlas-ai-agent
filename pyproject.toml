[project]
name = "atlas-ai-agent"
version = "0.1.0"
description = "Agente de IA com tool calling usando LangGraph, Gemini e FastAPI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Texto do prompt: quebrar linhas artificialmente mudaria o que o modelo recebe.
"app/agent/prompts.py" = ["E501"]
